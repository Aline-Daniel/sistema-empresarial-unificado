name: Verificar PHP
on:
  push:
    branches: [master, 'melhorias/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validar sintaxe PHP
        run: |
          set -e
          for file in ./*.php; do php -l "$file"; done
